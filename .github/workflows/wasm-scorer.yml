name: Verity WASM scorer

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - "wasm/verity-fact-check-scorer/**"
      - ".github/workflows/wasm-scorer.yml"
  pull_request:
    branches:
      - "foundation/**"
    paths:
      - "wasm/verity-fact-check-scorer/**"
      - ".github/workflows/wasm-scorer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run scorer unit tests
        run: cargo test --manifest-path wasm/verity-fact-check-scorer/Cargo.toml

      - name: Build standalone WASM
        run: cargo build --manifest-path wasm/verity-fact-check-scorer/Cargo.toml --release --target wasm32-unknown-unknown

      - name: Validate WASM module and Telegraph ABI
        shell: bash
        run: |
          set -euo pipefail
          file="wasm/verity-fact-check-scorer/target/wasm32-unknown-unknown/release/verity_fact_check_scorer.wasm"
          test -s "$file"
          size="$(wc -c < "$file")"
          test "$size" -le 33554432
          python - "$file" <<'PY'
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          if data[:8] != b"\x00asm\x01\x00\x00\x00":
              raise SystemExit("ERROR: invalid WASM magic or version")

          def uleb(buf, pos):
              value = 0
              shift = 0
              while True:
                  byte = buf[pos]
                  pos += 1
                  value |= (byte & 0x7f) << shift
                  if byte < 0x80:
                      return value, pos
                  shift += 7
                  if shift > 35:
                      raise SystemExit("ERROR: invalid unsigned LEB128")

          pos = 8
          exports = set()
          import_count = 0
          while pos < len(data):
              section_id = data[pos]
              pos += 1
              section_size, pos = uleb(data, pos)
              end = pos + section_size
              if end > len(data):
                  raise SystemExit("ERROR: truncated WASM section")
              section = data[pos:end]
              if section_id == 2:
                  import_count, _ = uleb(section, 0)
              elif section_id == 7:
                  count, cursor = uleb(section, 0)
                  for _ in range(count):
                      name_len, cursor = uleb(section, cursor)
                      name = section[cursor:cursor + name_len].decode("utf-8")
                      cursor += name_len
                      cursor += 1  # export kind
                      _, cursor = uleb(section, cursor)  # export index
                      exports.add(name)
              pos = end

          if import_count:
              raise SystemExit(f"ERROR: {import_count} imports found; Telegraph modules must be standalone")
          required = {"alloc", "dealloc", "rank_answer"}
          missing = required - exports
          if missing:
              raise SystemExit(f"ERROR: required exports missing: {sorted(missing)}")
          print(f"Validated WASM structure: {len(data)} bytes; no imports; exports={sorted(exports)}")
          PY

      - name: Calculate Keccak-256 for exact WASM bytes
        shell: bash
        run: |
          python -m pip install --quiet pycryptodome
          python - <<'PY'
          from Crypto.Hash import keccak
          from pathlib import Path
          path = Path("wasm/verity-fact-check-scorer/target/wasm32-unknown-unknown/release/verity_fact_check_scorer.wasm")
          digest = keccak.new(digest_bits=256)
          digest.update(path.read_bytes())
          print("WASM_KECCAK256=0x" + digest.hexdigest())
          Path("wasm/verity-fact-check-scorer/target/wasm32-unknown-unknown/release/verity_fact_check_scorer.keccak256.txt").write_text("0x" + digest.hexdigest() + "\n")
          PY

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v6
        with:
          name: verity-fact-check-scorer-wasm
          path: |
            wasm/verity-fact-check-scorer/target/wasm32-unknown-unknown/release/verity_fact_check_scorer.wasm
            wasm/verity-fact-check-scorer/target/wasm32-unknown-unknown/release/verity_fact_check_scorer.keccak256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned prototype release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: verity-fact-check-scorer-${{ github.sha }}
          name: Verity FACT_CHECK WASM prototype (${{ github.sha }})
          body: |
            Automated build of the Verity FACT_CHECK scoring-module prototype.

            This is a lexical-overlap baseline for evaluation, not a production-approved scorer.
            Do not register it on-chain until it passes Telegraph's live structural checks and active-champion benchmark.
          files: |
            wasm/verity-fact-check-scorer/target/wasm32-unknown-unknown/release/verity_fact_check_scorer.wasm
            wasm/verity-fact-check-scorer/target/wasm32-unknown-unknown/release/verity_fact_check_scorer.keccak256.txt
          fail_on_unmatched_files: true
